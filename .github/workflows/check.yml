name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet tool restore --tool-manifest tests/fixtures/project/dotnet-tools.json
      - run: python3 -m unittest discover -s tests -v
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo build --locked --release --target wasm32-wasip2
      - run: cargo clippy --locked --release --target wasm32-wasip2 -- -D warnings
